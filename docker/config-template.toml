# Rocky config inside the Docker container.
# Generated at container start by the entrypoint script.

[llm]
provider        = "ollama"
model           = "${ROCKY_OLLAMA_MODEL}"
ollama_base_url = "http://${ROCKY_OLLAMA_HOST}"

[voice]
provider        = "whisper-cpp"
model           = "/opt/whisper-models/ggml-base.en.bin"
binary          = "/usr/local/bin/whisper-cli"
silence_ms      = 700
tts             = "off"
browser_consent = false

[privacy]
strict = false
