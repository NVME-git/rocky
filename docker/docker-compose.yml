# docker compose -f docker/docker-compose.yml --profile demo up
# docker compose -f docker/docker-compose.yml --profile dev  run --rm rocky-dev

x-common-env: &common-env
  ROCKY_OLLAMA_HOST: ${ROCKY_OLLAMA_HOST:-host.docker.internal:11434}
  ROCKY_OLLAMA_MODEL: ${ROCKY_OLLAMA_MODEL:-llama3.2}
  ROCKY_BIND: 0.0.0.0:7777

services:
  # ── Demo profile ────────────────────────────────────────────────────────────
  # Automated, ephemeral, self-contained. Walks through the full lifecycle
  # against the bundled toy project and then sleeps so you can `docker exec`
  # into it to run `rocky view`.
  rocky-demo:
    profiles: ["demo"]
    image: rocky:demo
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["/usr/local/bin/entrypoint-demo"]
    environment:
      <<: *common-env
      DEMO_PAUSE: ${DEMO_PAUSE:-2}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "7777:7777"
    tty: true
    stdin_open: true

  # ── Dev profile ─────────────────────────────────────────────────────────────
  # Interactive bash shell. Mounts your repo at /workspace and persists the
  # knowledge graph + config across runs in named volumes. Use this for real
  # daily work or to demo against your own codebase.
  rocky-dev:
    profiles: ["dev"]
    image: rocky:demo
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["/usr/local/bin/entrypoint-dev"]
    environment:
      <<: *common-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "7777:7777"
    volumes:
      # Mount the repo you want Rocky to learn from. Override with:
      #   ROCKY_WORKSPACE=/path/to/your/repo docker compose ...
      - ${ROCKY_WORKSPACE:-./toy-project}:/workspace
      - rocky-config:/home/rocky/.config/rocky
      - rocky-data:/home/rocky/.rocky
    tty: true
    stdin_open: true

volumes:
  rocky-config:
  rocky-data:
