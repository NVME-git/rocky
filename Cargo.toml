[package]
name = "rocky"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "rocky"
path = "src/main.rs"

[features]
# v0.2: enables in-binary STT/audio capture. Pulls whisper-rs, cpal, webrtc-vad.
# Default Rocky build stays small; users wanting voice run:
#   cargo install --git https://github.com/NVME-git/rocky --features voice
# See docs/decisions/0006-voice-architecture.md.
voice = []
default = []

[dev-dependencies]
tempfile = "3"

[dependencies]
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
reqwest = { version = "0.13", features = ["blocking", "json"] }
dotenvy = "0.15"
chrono = "0.4"
colored = "3"
anyhow = "1"
dirs = "6"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tower-http = { version = "0.6", features = ["cors"] }
tempfile = "3"
