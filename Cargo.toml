[package]
name = "rocky"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rocky"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reqwest = { version = "0.12", features = ["blocking", "json"] }
dotenvy = "0.15"
chrono = "0.4"
colored = "2"
anyhow = "1"
dirs = "5"
