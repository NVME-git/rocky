<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background -->
  <rect width="64" height="64" rx="10" fill="#0A0E1A"/>

  <!-- Musical note -->
  <text x="42" y="14" font-family="serif" font-size="13" fill="#00D4FF">♫</text>

  <!-- Head -->
  <rect x="16" y="16" width="32" height="26" rx="6" fill="#00D4FF"/>

  <!-- Eyes -->
  <circle cx="25" cy="28" r="4.5" fill="#0A0E1A"/>
  <circle cx="39" cy="28" r="4.5" fill="#0A0E1A"/>
  <circle cx="26.5" cy="26.5" r="1.5" fill="white"/>
  <circle cx="40.5" cy="26.5" r="1.5" fill="white"/>

  <!-- Mouth line -->
  <line x1="24" y1="36" x2="40" y2="36" stroke="#0A0E1A" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Legs (||||) -->
  <line x1="21" y1="44" x2="19" y2="58" stroke="#00D4FF" stroke-width="3" stroke-linecap="round"/>
  <line x1="27" y1="44" x2="26" y2="58" stroke="#00D4FF" stroke-width="3" stroke-linecap="round"/>
  <line x1="32" y1="44" x2="32" y2="58" stroke="#00D4FF" stroke-width="3" stroke-linecap="round"/>
  <line x1="37" y1="44" x2="38" y2="58" stroke="#00D4FF" stroke-width="3" stroke-linecap="round"/>
  <line x1="43" y1="44" x2="45" y2="58" stroke="#00D4FF" stroke-width="3" stroke-linecap="round"/>
</svg>
