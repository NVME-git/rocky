<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rocky — Knowledge Graph</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
       background: #0A0E1A; color: #F1F5F9; height: 100vh; overflow: hidden;
       display: flex; flex-direction: column; }

/* ── top bar ── */
#topbar { background: #070B14; border-bottom: 1px solid #1E293B;
          padding: 10px 16px; display: flex; flex-direction: column; gap: 8px;
          flex-shrink: 0; }
#stats-row { display: flex; gap: 20px; align-items: center; }
.stat { font-size: 12px; color: #64748B; }
.stat span { color: #F1F5F9; font-weight: 600; margin-left: 4px; }
.stat-known span { color: #1D9E75; }
.stat-fading span { color: #EF9F27; }
.stat-gap span { color: #E24B4A; }

#controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
#search { background: #111827; border: 1px solid #1E293B; border-radius: 6px;
          color: #F1F5F9; padding: 4px 10px; font-size: 12px; width: 180px; outline: none; }
#search:focus { border-color: #F59E0B; }
#search::placeholder { color: #64748B; }
.domain-btn { background: #111827; border: 1px solid #1E293B; border-radius: 4px;
              color: #94A3B8; padding: 3px 8px; font-size: 11px; cursor: pointer;
              transition: all 0.15s; white-space: nowrap; }
.domain-btn:hover { border-color: #F59E0B; color: #F59E0B; }
.domain-btn.active { background: rgba(245,158,11,0.15); border-color: #F59E0B; color: #F59E0B; }
.domain-btn.all-btn { border-color: #334155; color: #CBD5E1; }
.domain-btn.all-btn.active { background: rgba(203,213,225,0.1); border-color: #CBD5E1; color: #CBD5E1; }

/* ── timeline strip ── */
#timeline-strip { background: #070B14; border-bottom: 1px solid #1E293B;
                  padding: 8px 16px; display: flex; align-items: center;
                  gap: 12px; flex-shrink: 0; }

#scrubber-wrap { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 0; }
#tl-scrubber { flex: 1; accent-color: #F59E0B; cursor: pointer; min-width: 0; }
#tl-date-label { font-size: 12px; color: #F59E0B; font-weight: 600;
                 white-space: nowrap; min-width: 130px; text-align: right; }
#tl-count-label { font-size: 11px; color: #64748B; white-space: nowrap; }

/* ── main ── */
#main { display: flex; flex: 1; overflow: hidden; }
#graph-container { flex: 1; position: relative; overflow: hidden; }
svg#graph { width: 100%; height: 100%; }

/* ── side panel ── */
#panel { width: 300px; background: #070B14; border-left: 1px solid #1E293B;
         overflow-y: auto; flex-shrink: 0; display: none; position: relative; }
#panel.open { display: block; }
#panel-inner { padding: 20px; }
#panel-close { position: absolute; top: 12px; right: 12px; background: none;
               border: none; color: #64748B; font-size: 18px; cursor: pointer; line-height: 1; }
#panel-close:hover { color: #F1F5F9; }
.panel-topic { font-size: 16px; font-weight: 700; color: #F1F5F9; margin-bottom: 4px; padding-right: 24px; }
.panel-domain { font-size: 11px; color: #F59E0B; text-transform: uppercase;
                letter-spacing: 0.5px; margin-bottom: 12px; }
.panel-desc { font-size: 13px; color: #94A3B8; line-height: 1.5; margin-bottom: 16px; }
.panel-row { display: flex; justify-content: space-between; font-size: 12px;
             padding: 5px 0; border-bottom: 1px solid #1E293B; }
.panel-label { color: #64748B; }
.panel-value { color: #F1F5F9; font-weight: 500; }
.panel-section { margin-top: 16px; }
.panel-section-title { font-size: 11px; color: #64748B; text-transform: uppercase;
                       letter-spacing: 0.5px; margin-bottom: 8px; }
.edge-item { font-size: 12px; padding: 6px 8px; background: #111827;
             border-radius: 4px; margin-bottom: 4px; }
.edge-kind { display: inline-block; font-size: 10px; padding: 1px 5px;
             border-radius: 3px; margin-right: 6px; font-weight: 600; }
.edge-kind.implies        { background: rgba(6,182,212,0.15); color: #06B6D4; }
.edge-kind.depends_on     { background: rgba(245,158,11,0.15); color: #F59E0B; }
.edge-kind.conflicts_with { background: rgba(226,75,74,0.15); color: #E24B4A; }
.edge-kind.part_of        { background: rgba(29,158,117,0.15); color: #1D9E75; }
.edge-peer { color: #CBD5E1; }

/* ── review history ── */
.review-item { margin-bottom: 10px; padding: 10px; background: #0A0E1A;
               border-radius: 6px; border: 1px solid #1E293B; }
.review-date { font-size: 10px; color: #64748B; margin-bottom: 6px; }
.review-q  { font-size: 12px; color: #94A3B8; margin-bottom: 4px; line-height: 1.45; }
.review-a  { font-size: 12px; color: #CBD5E1; margin-bottom: 4px; line-height: 1.45;
             font-style: italic; border-left: 2px solid #334155; padding-left: 8px; }
.review-fb { font-size: 12px; color: #06B6D4; line-height: 1.45; margin-bottom: 6px; }
.review-score { display: inline-block; font-size: 10px; font-weight: 600;
                padding: 1px 6px; border-radius: 3px; }
.review-score.known { background: rgba(29,158,117,0.15); color: #1D9E75; }
.review-score.stale { background: rgba(239,159,39,0.15);  color: #EF9F27; }
.review-score.gap   { background: rgba(226,75,74,0.15);   color: #E24B4A; }

/* ── graph elements ── */
.link { stroke-opacity: 0.6; transition: stroke-opacity 0.25s; }
.link.dimmed { stroke-opacity: 0.05; }
.node circle { cursor: pointer; transition: opacity 0.35s; }
.node text   { transition: opacity 0.35s; }
.node circle:hover { stroke: #F59E0B !important; stroke-width: 2px; }
.node.selected circle { stroke: #F59E0B !important; stroke-width: 2.5px; }
.node.dimmed circle { opacity: 0.18; }
.node.dimmed text   { opacity: 0.12; }
.node.highlighted circle { stroke: #F59E0B; stroke-width: 2px; }
.node text { pointer-events: none; font-size: 13px; fill: #CBD5E1; text-anchor: middle; }

.legend { position: absolute; bottom: 16px; left: 16px; background: rgba(7,11,20,0.85);
          border: 1px solid #1E293B; border-radius: 6px; padding: 10px 14px; }
.legend-title { font-size: 10px; color: #64748B; margin-bottom: 6px; text-transform: uppercase; }
.legend-row { display: flex; align-items: center; gap: 8px; font-size: 11px;
              color: #94A3B8; margin-bottom: 4px; }
</style>
</head>
<body>

<div id="topbar">
  <div id="stats-row">
    <div class="stat">Nodes: <span id="s-total"></span></div>
    <div class="stat stat-known">Known: <span id="s-known"></span></div>
    <div class="stat stat-fading">Fading: <span id="s-fading"></span></div>
    <div class="stat stat-gap">Gap: <span id="s-gap"></span></div>
    <div class="stat">Edges: <span id="s-edges"></span></div>
  </div>
  <div id="controls">
    <input id="search" type="text" placeholder="Search topics…">
    <div id="domain-filters"></div>
  </div>
</div>

<!-- always-visible scrubber strip -->
<div id="timeline-strip">
  <div id="scrubber-wrap">
    <input id="tl-scrubber" type="range" min="0" max="100" value="100">
    <span id="tl-date-label">all time</span>
  </div>
  <span id="tl-count-label"></span>
</div>

<div id="main">
  <div id="graph-container">
    <svg id="graph"></svg>
    <div class="legend">
      <div class="legend-title">Edge types</div>
      <div class="legend-row">
        <svg width="30" height="10"><line x1="0" y1="5" x2="30" y2="5" stroke="#06B6D4" stroke-width="1.5"/></svg>implies
      </div>
      <div class="legend-row">
        <svg width="30" height="10"><line x1="0" y1="5" x2="30" y2="5" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="6,3"/></svg>depends on
      </div>
      <div class="legend-row">
        <svg width="30" height="10"><line x1="0" y1="5" x2="30" y2="5" stroke="#1D9E75" stroke-width="1.5" stroke-dasharray="2,4"/></svg>part of
      </div>
      <div class="legend-row">
        <svg width="30" height="10"><line x1="0" y1="5" x2="30" y2="5" stroke="#E24B4A" stroke-width="1.5" stroke-dasharray="2,2"/></svg>conflicts
      </div>
    </div>
  </div>
  <div id="panel">
    <button id="panel-close">✕</button>
    <div id="panel-inner">
      <div class="panel-topic" id="p-topic"></div>
      <div class="panel-domain" id="p-domain"></div>
      <div class="panel-desc" id="p-desc"></div>
      <div class="panel-row"><span class="panel-label">Retrievability</span><span class="panel-value" id="p-recall"></span></div>
      <div class="panel-row"><span class="panel-label">Stability</span><span class="panel-value" id="p-stab"></span></div>
      <div class="panel-row"><span class="panel-label">Last reviewed</span><span class="panel-value" id="p-reviewed"></span></div>
      <div class="panel-row"><span class="panel-label">Reviews</span><span class="panel-value" id="p-count"></span></div>
      <div class="panel-row"><span class="panel-label">Kind</span><span class="panel-value" id="p-kind"></span></div>
      <div class="panel-section">
        <div class="panel-section-title">Edges</div>
        <div id="p-edges"></div>
      </div>
      <div class="panel-section" id="p-reviews-section">
        <div class="panel-section-title">Review History</div>
        <div id="p-reviews"></div>
      </div>
    </div>
  </div>
</div>

<script>
const PKG = {"nodes":[{"id":"rust-async/await","topic":"Rust async/await","kind":"concept","domain":"Language","description":"Rust async/await builds on zero-cost state machines \u2014 when you write async fn, the compiler generates a state machine, not threads.","stability":4.5,"difficulty":0.3,"retrievability":0.849,"classification":"stale","last_reviewed":"2026-04-01","review_count":1,"created_at":"2026-04-01","reviews":[{"date":"2026-04-01","question":"You have a Rust async function that makes two independent HTTP calls. Right now they run sequentially. How would you run them concurrently, and what's the difference between join! and select!?","answer":"tokio::join! runs both futures concurrently and waits for both to finish. select! waits for whichever resolves first and cancels the other. For two independent calls where I want both results, join! is correct.","feedback":"Good distinction. Worth noting: join! doesn't parallelize \u2014 both futures still run on a single thread unless you spawn tasks. tokio::spawn moves them to the thread pool.","score":0.85},{"date":"2026-04-08","question":"You have an async function holding a std::sync::Mutex guard across an .await point. Your future gets suspended. What happens to other tasks that try to lock the same Mutex?","answer":"They deadlock. If a future holds a std::sync::Mutex across an await point, the thread is suspended with the lock held. No other task on that thread can acquire it. Use tokio::sync::Mutex for async contexts \u2014 its lock is async-aware and yields the thread instead of blocking it.","feedback":"Fist my bump, friend! Is correct!","score":0.92}]},{"id":"tokio-runtime","topic":"tokio runtime","kind":"concept","domain":"Language","description":"The async executor that drives Rust futures \u2014 manages the thread pool and event loop.","stability":4.5,"difficulty":0.3,"retrievability":0.849,"classification":"stale","last_reviewed":"2026-04-01","review_count":1,"created_at":"2026-04-01","reviews":[{"date":"2026-04-01","question":"You add #[tokio::main] to your main function. What does it actually do, and what's the difference between the current_thread and multi_thread flavours?","answer":"#[tokio::main] is a macro that creates a tokio runtime and calls block_on on your main future. current_thread runs everything on one thread; multi_thread (default) uses a thread pool matching your CPU cores.","feedback":"Excite excite excite! Friend get it!","score":0.88}]},{"id":"axum-framework","topic":"Axum framework","kind":"concept","domain":"Language","description":"A Rust web framework built on hyper and tower \u2014 composable routing with extractors and type-safe middleware.","stability":4.5,"difficulty":0.3,"retrievability":0.849,"classification":"stale","last_reviewed":"2026-04-01","review_count":1,"created_at":"2026-04-01","reviews":[{"date":"2026-04-01","question":"You want to add request logging to every route in Axum. What's the difference between a tower Layer and a tower Service, and how do they compose in Axum?","answer":"A Service is the core abstraction \u2014 takes a request, returns a future with a response. A Layer wraps a Service to add behaviour (logging, auth, etc.). Router::layer applies a tower Layer to all routes.","feedback":"We are crew. We solve together. Is correct!","score":0.87}]},{"id":"sqlx-connection-pooling","topic":"sqlx connection pooling","kind":"implementation","domain":"Database","description":"Async database driver for Rust with compile-time query checking \u2014 PgPool manages a pool of reusable PostgreSQL connections.","stability":4.8,"difficulty":0.3,"retrievability":0.877,"classification":"stale","last_reviewed":"2026-04-02","review_count":1,"created_at":"2026-04-02","reviews":[{"date":"2026-04-02","question":"Your API gets a burst of 200 simultaneous requests. With sqlx PgPool, what happens when all pool connections are in use?","answer":"New requests wait until a connection is freed. PgPool has a max_connections setting \u2014 if the pool is exhausted the request blocks until one becomes available, and returns an error if it waits longer than connect_timeout.","feedback":"Fist my bump, friend! Is correct!","score":0.88}]},{"id":"database-migrations","topic":"database migrations","kind":"concept","domain":"Database","description":"Versioned, incremental changes to your database schema \u2014 tracked so they apply once and in order across all environments.","stability":5,"difficulty":0.3,"retrievability":0.881,"classification":"stale","last_reviewed":"2026-04-02","review_count":1,"created_at":"2026-04-02","reviews":[{"date":"2026-04-02","question":"sqlx stores a checksum of each migration file and tracks which have already run. If the checksum differs from what ran before, what does sqlx do \u2014 and why does it refuse rather than re-apply?","answer":"Oh \u2014 sqlx refuses to run it entirely. Re-running a migration that already applied could corrupt the schema. The checksum is a safety guard: it detects edits after the fact and blocks them.","feedback":"Is correct, friend! Rocky also learn this hard way.","score":0.9}]},{"id":"jwt-authentication","topic":"JWT authentication","kind":"pattern","domain":"Auth","description":"Stateless token-based auth where the server signs a payload the client stores and sends back on every request.","stability":5.2,"difficulty":0.3,"retrievability":0.904,"classification":"known","last_reviewed":"2026-04-03","review_count":1,"created_at":"2026-04-03","reviews":[{"date":"2026-04-03","question":"You're issuing JWTs with a 15-minute expiry. A user's access token expires mid-checkout. What needs to happen on both sides for the experience to feel seamless, without storing session state on the server?","answer":"The client stores a refresh token in an httpOnly cookie. When the access token expires, the client sends the refresh token to /refresh. The server validates it against a database (so it can be revoked) and issues a new access token. The user never sees a login screen.","feedback":"Fist my bump, friend! Is correct!","score":0.91}]},{"id":"httponly-cookie-security","topic":"httpOnly cookie security","kind":"concept","domain":"Auth","description":"Cookies with the HttpOnly flag cannot be read by JavaScript \u2014 only sent by the browser automatically on requests to the matching domain.","stability":5,"difficulty":0.3,"retrievability":0.9,"classification":"known","last_reviewed":"2026-04-03","review_count":1,"created_at":"2026-04-03","reviews":[]},{"id":"token-expiry-handling","topic":"token expiry handling","kind":"concept","domain":"Auth","description":"Managing the lifecycle of short-lived access tokens and long-lived refresh tokens to maintain seamless sessions.","stability":4.8,"difficulty":0.3,"retrievability":0.896,"classification":"stale","last_reviewed":"2026-04-03","review_count":1,"created_at":"2026-04-03","reviews":[{"date":"2026-04-03","question":"","answer":"e","feedback":"Marked as already known.","score":0.75}]},{"id":"redis-ttl-expiry","topic":"Redis TTL expiry","kind":"implementation","domain":"Performance","description":"Time-based automatic key removal in Redis \u2014 keys expire and are deleted after a configured duration.","stability":5.1,"difficulty":0.3,"retrievability":0.921,"classification":"known","last_reviewed":"2026-04-04","review_count":1,"created_at":"2026-04-04","reviews":[{"date":"2026-04-04","question":"You cache a user's profile in Redis with a 5-minute TTL. The user updates their profile. The API writes the update to Postgres and returns 200. A second request 30 seconds later hits Redis \u2014 what does it get, and how do you fix it?","answer":"It gets stale data \u2014 the cache still has the old profile. The fix is either write-through (update both Postgres and Redis on writes) or cache invalidation (delete the key on write and let the next read repopulate). Write-through keeps reads fast; invalidation is simpler but causes one cache miss after each write.","feedback":"Is correct! Rocky appreciate the trade-off answer.","score":0.89}]},{"id":"cache-invalidation","topic":"cache invalidation","kind":"concept","domain":"Performance","description":"Approaches for keeping a cache consistent with its source of truth \u2014 write-through, cache-aside, TTL expiry, and explicit invalidation.","stability":5.2,"difficulty":0.3,"retrievability":0.922,"classification":"known","last_reviewed":"2026-04-04","review_count":1,"created_at":"2026-04-04","reviews":[{"date":"2026-04-04","question":"The root issue is in-memory caches are per-process and can't see each other. Where does Redis sit relative to your API servers, and why does that eliminate the staleness problem entirely?","answer":"Redis is shared outside the processes \u2014 all servers read and write the same cache. There is no per-server copy to go stale. Cache-aside means any server that updates Redis, all others immediately see it.","feedback":"Fist my bump, friend!","score":0.87}]},{"id":"redis-sorted-sets","topic":"Redis sorted sets","kind":"implementation","domain":"Database","description":"A Redis data structure mapping member strings to floating-point scores \u2014 ordered by score, O(log N) insert and rank queries.","stability":5.3,"difficulty":0.3,"retrievability":0.942,"classification":"known","last_reviewed":"2026-04-05","review_count":1,"created_at":"2026-04-05","reviews":[{"date":"2026-04-07","question":"Your rate limiter identifies users by their JWT subject claim. A malicious client strips the Authorization header. The limiter falls back to IP-based limits. What's the attack vector and how do you close it?","answer":"IP-based fallback can be bypassed by rotating IPs via proxies or Tor. The fix: require auth on all rate-limited routes \u2014 return 401 if no valid JWT is present. Never fall back to IP for authenticated endpoints; IP limits only make sense for unauthenticated routes like /login.","feedback":"Excite! Cross-concept question! Friend connect the dots!","score":0.9}]},{"id":"lua-scripting-in-redis","topic":"Lua scripting in Redis","kind":"concept","domain":"Database","description":"Redis executes Lua scripts atomically \u2014 the entire script runs as a single operation, preventing race conditions.","stability":5.5,"difficulty":0.3,"retrievability":0.944,"classification":"known","last_reviewed":"2026-04-05","review_count":1,"created_at":"2026-04-05","reviews":[{"date":"2026-04-07","question":"Your rate limiter checks a Redis sorted set and increments a counter in two separate commands. Under load, two requests arrive simultaneously. Both see the count is under the limit and both pass. What's the fix, and what makes it correct?","answer":"This is a TOCTOU race \u2014 check-then-act without atomicity. The fix is a Lua script: Redis executes the entire script atomically \u2014 no other command can interleave. The script checks, conditionally increments, and returns the result as a single atomic operation.","feedback":"Fist my bump! Lua scripts in Redis \u2014 atomically or nothing!","score":0.93}]},{"id":"language","topic":"Language","kind":"domain","domain":"Language","description":"Language domain","stability":999,"difficulty":0,"retrievability":1,"classification":"known","last_reviewed":"","review_count":0,"created_at":"2026-03-01","reviews":[]},{"id":"database","topic":"Database","kind":"domain","domain":"Database","description":"Database domain","stability":999,"difficulty":0,"retrievability":1,"classification":"known","last_reviewed":"","review_count":0,"created_at":"2026-03-01","reviews":[]},{"id":"auth","topic":"Auth","kind":"domain","domain":"Auth","description":"Auth domain","stability":999,"difficulty":0,"retrievability":1,"classification":"known","last_reviewed":"","review_count":0,"created_at":"2026-03-01","reviews":[]},{"id":"performance","topic":"Performance","kind":"domain","domain":"Performance","description":"Performance domain","stability":999,"difficulty":0,"retrievability":1,"classification":"known","last_reviewed":"","review_count":0,"created_at":"2026-03-01","reviews":[]},{"id":"__user__","topic":"alex","kind":"user","domain":"","description":"Your personal knowledge graph","stability":999,"difficulty":0,"retrievability":1,"classification":"known","last_reviewed":"","review_count":0,"created_at":"","reviews":[]}],"edges":[{"id":"e1","source":"rust-async/await","target":"tokio-runtime","kind":"depends_on","description":"Rust async code requires a runtime to drive futures; tokio is the standard choice.","strength":0.88},{"id":"e2","source":"tokio-runtime","target":"axum-framework","kind":"depends_on","description":"Axum is built on hyper/tower which uses tokio as its async runtime.","strength":0.9},{"id":"e3","source":"sqlx-connection-pooling","target":"database-migrations","kind":"depends_on","description":"Connection pools are used with migrated schemas; migrations must run before the pool is opened.","strength":0.8},{"id":"e4","source":"database-migrations","target":"sqlx-connection-pooling","kind":"implies","description":"Running sqlx migrations implies having a connection pool configured to connect to the database.","strength":0.78},{"id":"e5","source":"jwt-authentication","target":"httponly-cookie-security","kind":"implies","description":"JWTs stored insecurely are vulnerable to XSS; httpOnly cookies prevent JavaScript access.","strength":0.92},{"id":"e6","source":"jwt-authentication","target":"token-expiry-handling","kind":"implies","description":"Issuing JWTs requires handling expiry \u2014 access tokens expire, refresh tokens rotate.","strength":0.89},{"id":"e7","source":"token-expiry-handling","target":"httponly-cookie-security","kind":"depends_on","description":"Refresh tokens must be stored in httpOnly cookies to be safe during token rotation.","strength":0.81},{"id":"e8","source":"redis-ttl-expiry","target":"cache-invalidation","kind":"depends_on","description":"TTL is one invalidation strategy; understanding TTL expiry depends on knowing invalidation trade-offs.","strength":0.75},{"id":"e9","source":"cache-invalidation","target":"jwt-authentication","kind":"conflicts_with","description":"Stateless JWTs cannot be invalidated server-side without adding state \u2014 conflicts with pure cache invalidation.","strength":0.65},{"id":"e10","source":"jwt-authentication","target":"redis-sorted-sets","kind":"implies","description":"Rate limiting often identifies users by their JWT subject claim, using sorted sets to track request timestamps.","strength":0.78},{"id":"e11","source":"redis-sorted-sets","target":"lua-scripting-in-redis","kind":"depends_on","description":"Atomic sorted set operations for rate limiting require Lua scripts to prevent TOCTOU races.","strength":0.87},{"id":"e12","source":"lua-scripting-in-redis","target":"redis-sorted-sets","kind":"part_of","description":"Lua scripting in Redis is most commonly used in the context of sorted set-based rate limiting.","strength":0.82},{"id":"e13","source":"redis-sorted-sets","target":"redis-ttl-expiry","kind":"implies","description":"Sorted sets used for rate limiting windows rely on TTL or ZREMRANGEBYSCORE for expiry.","strength":0.8},{"id":"language-user","source":"language","target":"__user__","kind":"part_of","description":"","strength":1},{"id":"database-user","source":"database","target":"__user__","kind":"part_of","description":"","strength":1},{"id":"auth-user","source":"auth","target":"__user__","kind":"part_of","description":"","strength":1},{"id":"performance-user","source":"performance","target":"__user__","kind":"part_of","description":"","strength":1}],"userName":"alex"};

// ── colour helpers ──────────────────────────────────────────────────────────
function nodeColor(d) {
  if (d.kind === 'user')   return '#F59E0B';
  if (d.kind === 'domain') return '#1E293B';
  const r = d.retrievability;
  if (r >= 0.7) return d3.interpolateRgb('#EF9F27', '#1D9E75')((r - 0.7) / 0.3);
  return d3.interpolateRgb('#E24B4A', '#EF9F27')(r / 0.7);
}
function nodeRadius(d) {
  if (d.kind === 'user')   return 28;
  if (d.kind === 'domain') return 18;
  return Math.max(6, Math.min(22, 6 + d.stability * 1.2));
}
function nodeStroke(d) {
  if (d.kind === 'user')   return '#F59E0B';
  if (d.kind === 'domain') return '#475569';
  return '#0A0E1A';
}
function nodeStrokeWidth(d) {
  return (d.kind === 'user' || d.kind === 'domain') ? 2 : 1.5;
}

// ── stats ───────────────────────────────────────────────────────────────────
const nodes = PKG.nodes;
const edges = PKG.edges;
const topicNodes = nodes.filter(n => n.kind !== 'domain' && n.kind !== 'user');
document.getElementById('s-total').textContent = topicNodes.length;
document.getElementById('s-known').textContent = topicNodes.filter(n => n.classification === 'known').length;
document.getElementById('s-fading').textContent = topicNodes.filter(n => n.classification === 'stale').length;
document.getElementById('s-gap').textContent = topicNodes.filter(n => n.classification === 'gap').length;
document.getElementById('s-edges').textContent = edges.filter(e => {
  const s = nodes.find(n => n.id === (typeof e.source === 'object' ? e.source.id : e.source));
  const t = nodes.find(n => n.id === (typeof e.target === 'object' ? e.target.id : e.target));
  return s && t && s.kind !== 'domain' && s.kind !== 'user' && t.kind !== 'domain' && t.kind !== 'user';
}).length;

// ── domain filter ───────────────────────────────────────────────────────────
const domains = [...new Set(topicNodes.map(n => n.domain || 'Other'))].sort();
let activeDomains = new Set(domains);
let scrubberCutoff = null; // null = show all

const filterEl = document.getElementById('domain-filters');
const allBtn = document.createElement('button');
allBtn.className = 'domain-btn all-btn active';
allBtn.textContent = 'All';
allBtn.onclick = () => {
  const allActive = activeDomains.size === domains.length;
  if (allActive) {
    // Deselect all — user can then click individual domains
    activeDomains = new Set();
    document.querySelectorAll('.domain-btn:not(.all-btn)').forEach(b => b.classList.remove('active'));
    allBtn.classList.remove('active');
  } else {
    activeDomains = new Set(domains);
    document.querySelectorAll('.domain-btn:not(.all-btn)').forEach(b => b.classList.add('active'));
    allBtn.classList.add('active');
  }
  applyFilters();
};
filterEl.appendChild(allBtn);
domains.forEach(d => {
  const btn = document.createElement('button');
  btn.className = 'domain-btn active';
  btn.textContent = d;
  btn.onclick = () => {
    const wasAllActive = activeDomains.size === domains.length;
    if (wasAllActive) {
      // Exclusive select: deselect all, activate only this one
      activeDomains = new Set([d]);
      document.querySelectorAll('.domain-btn:not(.all-btn)').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      allBtn.classList.remove('active');
    } else {
      if (activeDomains.has(d)) { activeDomains.delete(d); btn.classList.remove('active'); }
      else { activeDomains.add(d); btn.classList.add('active'); }
      allBtn.classList.toggle('active', activeDomains.size === domains.length);
    }
    applyFilters();
  };
  filterEl.appendChild(btn);
});

// ── search ──────────────────────────────────────────────────────────────────
let searchTerm = '';
document.getElementById('search').addEventListener('input', e => {
  searchTerm = e.target.value.toLowerCase().trim();
  applyFilters();
});

function applyFilters() {
  const visible = new Set(
    nodes
      // Domain and user nodes are always visible
      .filter(n => n.kind === 'domain' || n.kind === 'user' ||
        ((!scrubberCutoff || n.created_at <= scrubberCutoff) &&
         (activeDomains.size > 0 && activeDomains.has(n.domain || 'Other')) &&
         (!searchTerm || n.topic.toLowerCase().includes(searchTerm))))
      .map(n => n.id)
  );
  nodeGroup.selectAll('.node').each(function(d) {
    const show = visible.has(d.id);
    const isStructural = d.kind === 'domain' || d.kind === 'user';
    d3.select(this).classed('dimmed', !show).classed('highlighted', show && !!searchTerm && !isStructural);
  });
  linkGroup.selectAll('.link').classed('dimmed', d => {
    const s = typeof d.source === 'object' ? d.source.id : d.source;
    const t = typeof d.target === 'object' ? d.target.id : d.target;
    return !visible.has(s) || !visible.has(t);
  });
}

// ── D3 force graph ──────────────────────────────────────────────────────────
const svg = d3.select('#graph');
const container = document.getElementById('graph-container');
const W = () => container.clientWidth;
const H = () => container.clientHeight;

const g = svg.append('g');
svg.call(d3.zoom().scaleExtent([0.2, 4]).on('zoom', e => g.attr('transform', e.transform)));

const defs = svg.append('defs');
const arrowColors = { implies: '#06B6D4', depends_on: '#F59E0B', conflicts_with: '#E24B4A', part_of: '#1D9E75' };
['implies','depends_on','conflicts_with','part_of'].forEach(k => {
  defs.append('marker').attr('id', 'arrow-' + k)
    .attr('viewBox', '0 -5 10 10').attr('refX', 0).attr('refY', 0)
    .attr('markerWidth', 6).attr('markerHeight', 6).attr('orient', 'auto')
    .append('path').attr('d', 'M0,-5L10,0L0,5').attr('fill', arrowColors[k]);
});

const linkGroup = g.append('g');
const nodeGroup = g.append('g');

const edgeStyle = {
  implies:        { dash: null,  color: '#06B6D4' },
  depends_on:     { dash: '6,3', color: '#F59E0B' },
  part_of:        { dash: '2,4', color: '#1D9E75' },
  conflicts_with: { dash: '2,2', color: '#E24B4A' },
};

const link = linkGroup.selectAll('.link')
  .data(edges).enter().append('line').attr('class', 'link')
  .attr('stroke', d => (edgeStyle[d.kind] || edgeStyle.implies).color)
  .attr('stroke-width', d => Math.max(1, d.strength * 2.5))
  .attr('stroke-dasharray', d => (edgeStyle[d.kind] || edgeStyle.implies).dash)
  .attr('marker-end', d => `url(#arrow-${d.kind})`);

const simulation = d3.forceSimulation(nodes)
  .force('link', d3.forceLink(edges).id(d => d.id).distance(d => {
    const s = typeof d.source === 'object' ? d.source : nodes.find(n => n.id === d.source);
    const t = typeof d.target === 'object' ? d.target : nodes.find(n => n.id === d.target);
    if (t && t.kind === 'user') return 100;
    if (s && s.kind === 'domain') return 70;
    return 60 + (1 - d.strength) * 40;
  }))
  .force('charge', d3.forceManyBody().strength(d =>
    d.kind === 'user' ? -300 : d.kind === 'domain' ? -150 : -90
  ))
  .force('center', d3.forceCenter(W() / 2, H() / 2))
  .force('collision', d3.forceCollide().radius(d => nodeRadius(d) + 6));

const node = nodeGroup.selectAll('.node')
  .data(nodes).enter().append('g').attr('class', 'node')
  .call(d3.drag()
    .on('start', (e, d) => { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
    .on('drag',  (e, d) => { d.fx = e.x; d.fy = e.y; })
    .on('end',   (e, d) => { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }))
  .on('click', (e, d) => { e.stopPropagation(); selectNode(d); });

node.append('circle')
  .attr('r', d => nodeRadius(d))
  .attr('fill', d => nodeColor(d))
  .attr('stroke', d => nodeStroke(d))
  .attr('stroke-width', d => nodeStrokeWidth(d));

node.append('text')
  .style('font-size', d => d.kind === 'user' ? '13px' : d.kind === 'domain' ? '11px' : '13px')
  .style('font-weight', d => (d.kind === 'user' || d.kind === 'domain') ? '700' : 'normal')
  .style('fill', d => d.kind === 'user' ? '#0A0E1A' : d.kind === 'domain' ? '#F1F5F9' : '#CBD5E1')
  .each(function(d) {
    const el = d3.select(this);
    if (d.kind === 'user') {
      // Word-wrap to fit inside circle (r=28 → ~8 chars per line at 11px bold)
      const maxChars = 9, lineH = 15;
      const words = d.topic.split(/\s+/);
      const lines = [];
      let cur = '';
      for (const w of words) {
        const word = w.length > maxChars ? w.slice(0, maxChars - 1) + '…' : w;
        const test = cur ? cur + ' ' + word : word;
        if (test.length <= maxChars) { cur = test; }
        else { if (cur) lines.push(cur); cur = word; }
      }
      if (cur) lines.push(cur);
      // Centre the block vertically
      const startDy = -(lines.length - 1) * lineH / 2;
      lines.forEach((line, i) =>
        el.append('tspan').attr('x', 0).attr('dy', i === 0 ? startDy : lineH).text(line));
    } else if (d.kind === 'domain') {
      const t = d.topic;
      el.attr('dy', '0').style('dominant-baseline', 'central')
        .text(t.length > 9 ? t.slice(0, 8) + '…' : t);
    } else {
      el.attr('dy', nodeRadius(d) + 14)
        .text(d.topic.length > 22 ? d.topic.slice(0, 20) + '…' : d.topic);
    }
  });

simulation.on('tick', () => {
  link.each(function(d) {
    const dx = d.target.x - d.source.x, dy = d.target.y - d.source.y;
    const dist = Math.sqrt(dx*dx + dy*dy) || 1;
    const srcR = nodeRadius(d.source) + 4;
    const tgtR = nodeRadius(d.target) + 10;
    d3.select(this)
      .attr('x1', d.source.x + dx/dist * srcR)
      .attr('y1', d.source.y + dy/dist * srcR)
      .attr('x2', d.target.x - dx/dist * tgtR)
      .attr('y2', d.target.y - dy/dist * tgtR);
  });
  node.attr('transform', d => `translate(${d.x},${d.y})`);
});

svg.on('click', () => closePanel());
window.addEventListener('resize', () => {
  simulation.force('center', d3.forceCenter(W() / 2, H() / 2)).alpha(0.1).restart();
});

// ── side panel ──────────────────────────────────────────────────────────────
const edgeIndex = {};
nodes.forEach(n => { edgeIndex[n.id] = []; });
edges.forEach(e => {
  const s = typeof e.source === 'object' ? e.source.id : e.source;
  const t = typeof e.target === 'object' ? e.target.id : e.target;
  if (edgeIndex[s]) edgeIndex[s].push({ ...e, peer: t });
  if (edgeIndex[t]) edgeIndex[t].push({ ...e, peer: s });
});
const nodeById = Object.fromEntries(nodes.map(n => [n.id, n]));

function selectNode(d) {
  node.classed('selected', n => n.id === d.id);
  document.getElementById('p-topic').textContent = d.topic;
  document.getElementById('p-domain').textContent = d.domain || 'Other';
  document.getElementById('p-desc').textContent = d.description;
  document.getElementById('p-recall').textContent = (d.retrievability * 100).toFixed(0) + '%';
  document.getElementById('p-stab').textContent = d.stability.toFixed(1) + 'd';
  document.getElementById('p-reviewed').textContent = d.last_reviewed;
  document.getElementById('p-count').textContent = d.review_count;
  document.getElementById('p-kind').textContent = d.kind;
  const nodeEdges = edgeIndex[d.id] || [];
  document.getElementById('p-edges').innerHTML = nodeEdges.length === 0
    ? '<div style="color:#64748B;font-size:12px">No edges yet</div>'
    : nodeEdges.map(e => {
        const label = nodeById[e.peer] ? nodeById[e.peer].topic : e.peer;
        return `<div class="edge-item"><span class="edge-kind ${e.kind}">${e.kind.replace(/_/g,' ')}</span><span class="edge-peer">${label}</span></div>`;
      }).join('');
  // Review history — hidden for structural (domain/user) nodes
  const reviewSection = document.getElementById('p-reviews-section');
  const reviews = d.reviews || [];
  if (d.kind === 'domain' || d.kind === 'user') {
    reviewSection.style.display = 'none';
  } else {
    reviewSection.style.display = '';
    document.getElementById('p-reviews').innerHTML = reviews.length === 0
      ? '<div style="color:#64748B;font-size:12px">No reviews yet</div>'
      : reviews.map(r => {
          const pct = Math.round(r.score * 100);
          const cls = pct >= 70 ? 'known' : pct >= 40 ? 'stale' : 'gap';
          return `<div class="review-item">
            <div class="review-date">${r.date}</div>
            ${r.question ? `<div class="review-q">Q: ${r.question}</div>` : ''}
            ${r.answer   ? `<div class="review-a">${r.answer}</div>` : ''}
            ${r.feedback ? `<div class="review-fb">${r.feedback}</div>` : ''}
            <span class="review-score ${cls}">${pct}%</span>
          </div>`;
        }).join('');
  }
  document.getElementById('panel').classList.add('open');
}
function closePanel() {
  document.getElementById('panel').classList.remove('open');
  node.classed('selected', false);
}
document.getElementById('panel-close').onclick = closePanel;

// ── timeline / scrubber ─────────────────────────────────────────────────────
// Scrubber positions: one per node sorted by created_at, plus sentinel for "all"
const sortedDates = [...new Set(nodes.map(n => n.created_at))].sort();
sortedDates.push('9999-99-99');
const scrubber = document.getElementById('tl-scrubber');
scrubber.max = sortedDates.length - 1;
scrubber.value = sortedDates.length - 1;

scrubber.addEventListener('input', onScrub);

function onScrub() {
  const idx = parseInt(scrubber.value);
  const isAll = idx === sortedDates.length - 1;
  const cutoff = isAll ? null : sortedDates[idx];
  scrubberCutoff = cutoff;
  applyFilters();

  const count = isAll ? nodes.length : nodes.filter(n => n.created_at <= cutoff).length;
  document.getElementById('tl-date-label').textContent = isAll ? 'all time' : cutoff;
  document.getElementById('tl-count-label').textContent = `${count} / ${nodes.length} topics`;
}
onScrub(); // initialise labels
</script>
</body>
</html>
