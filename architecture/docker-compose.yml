services:
  structurizr:
    image: structurizr/structurizr
    command: local
    # Match host uid/gid so the container can write workspace.json and the
    # .structurizr/ cache (search index, logs, image cache). Without this the
    # container runs as the baked-in `nonroot` user and chokes on the bind mount.
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "8080:8080"
    volumes:
      - .:/usr/local/structurizr
      # !adrs requires every file in the directory to follow the NNNN-title.md
      # convention. The decisions index lives at docs/decisions.md (one level
      # up) so this directory contains only numbered ADRs and can be mounted
      # whole.
      - ../docs/decisions:/usr/local/structurizr/decisions:ro
    restart: unless-stopped
