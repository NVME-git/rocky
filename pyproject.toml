[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "rocky"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.86.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
rocky = "rocky.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rocky*"]
