<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 400px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           background: #1e1e2e; color: #cdd6f4; font-size: 13px; }

    /* ── header */
    .header { display: flex; align-items: center; justify-content: space-between;
              padding: 10px 14px; background: #181825; border-bottom: 1px solid #313244; }
    .header h1 { font-size: 15px; display: flex; align-items: center; gap: 7px; }
    .header-right { display: flex; align-items: center; gap: 8px; }
    .server-dot { width: 8px; height: 8px; border-radius: 50%; background: #45475a; flex-shrink: 0; }
    .server-dot.connected { background: #a6e3a1; }
    .server-dot.error { background: #f38ba8; }
    .server-label { font-size: 10px; color: #6c7086; }

    /* Rocky IQ pill in header */
    .iq-pill { display: none; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 700;
               cursor: help; }
    .iq-good { background: #a6e3a1; color: #1e1e2e; }
    .iq-warn { background: #f9e2af; color: #1e1e2e; }
    .iq-bad  { background: #f38ba8; color: #1e1e2e; }

    /* ── tabs */
    .tabs { display: flex; border-bottom: 1px solid #313244; }
    .tab { flex: 1; padding: 8px; text-align: center; cursor: pointer; font-size: 12px;
           color: #6c7086; border: none; background: none; transition: all .15s; }
    .tab:hover { color: #cdd6f4; background: #282839; }
    .tab.active { color: #89b4fa; border-bottom: 2px solid #89b4fa; }

    /* ── panels */
    .panel { display: none; padding: 12px 14px; }
    .panel.active { display: block; }

    /* ── capture panel */
    label { display: block; font-size: 11px; color: #a6adc8; margin-bottom: 3px; margin-top: 10px; }
    label:first-child { margin-top: 0; }
    input, textarea, select {
      width: 100%; padding: 7px 9px; border: 1px solid #45475a; border-radius: 5px;
      background: #313244; color: #cdd6f4; font-size: 12px; outline: none;
    }
    input:focus, textarea:focus, select:focus { border-color: #89b4fa; }
    textarea { resize: vertical; min-height: 50px; font-family: inherit; }

    /* source badge */
    .source-badge { display: inline-block; padding: 1px 6px; border-radius: 8px; font-size: 10px;
                    background: #313244; color: #89b4fa; margin-left: 6px; }

    /* topic list */
    .topic-search-row { position: relative; margin-top: 6px; }
    .topic-search-row input { padding-right: 60px; }
    .topic-count { position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
                   font-size: 10px; color: #6c7086; }
    .topic-list { max-height: 130px; overflow-y: auto; margin-top: 6px; display: flex;
                  flex-wrap: wrap; gap: 4px; }
    .topic-chip {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 9px; border-radius: 12px; background: #313244;
      font-size: 11px; cursor: pointer; border: 1px solid #45475a; transition: all .1s;
    }
    .topic-chip:hover { border-color: #89b4fa; }
    .topic-chip.selected { background: #89b4fa; color: #1e1e2e; border-color: #89b4fa; }
    .topic-chip.suggested { border-color: #cba6f7; color: #cba6f7; }
    .topic-chip.suggested.selected { background: #cba6f7; color: #1e1e2e; }
    .r-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .r-known { background: #a6e3a1; }
    .r-stale { background: #f9e2af; }
    .r-gap { background: #f38ba8; }

    /* suggestions section */
    .suggestions-label { font-size: 10px; color: #6c7086; margin: 6px 0 4px; }

    /* add button */
    .add-btn { width: 100%; padding: 9px; border: none; border-radius: 6px; cursor: pointer;
               font-size: 13px; font-weight: 600; background: #89b4fa; color: #1e1e2e; margin-top: 10px; }
    .add-btn:hover { background: #74c7ec; }
    .add-btn:disabled { background: #45475a; color: #6c7086; cursor: not-allowed; }
    .status { font-size: 11px; margin-top: 6px; text-align: center; min-height: 16px; }
    .status.ok { color: #a6e3a1; }
    .status.error { color: #f38ba8; }

    /* ── history panel */
    .history-list { display: flex; flex-direction: column; gap: 6px; max-height: 340px; overflow-y: auto; }
    .history-item { background: #313244; border-radius: 6px; padding: 8px 10px; }
    .history-title { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .history-meta { font-size: 10px; color: #6c7086; margin-top: 2px; display: flex; gap: 8px; }
    .history-topics { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 3px; }
    .history-topic { font-size: 10px; padding: 1px 6px; border-radius: 8px; background: #45475a; }
    .empty-state { text-align: center; color: #6c7086; padding: 20px 0; font-size: 12px; }

    /* ── settings panel */
    .settings-section { margin-bottom: 14px; }
    .settings-section h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .5px;
                           color: #6c7086; margin-bottom: 8px; }
    .sync-btn { padding: 7px 14px; border-radius: 5px; border: 1px solid #45475a; background: #313244;
                color: #cdd6f4; cursor: pointer; font-size: 12px; }
    .sync-btn:hover { border-color: #89b4fa; color: #89b4fa; }
    .sync-info { font-size: 10px; color: #6c7086; margin-top: 4px; }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #1e1e2e; }
    ::-webkit-scrollbar-thumb { background: #45475a; border-radius: 3px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🪨 Rocky</h1>
    <div class="header-right">
      <span class="iq-pill" id="iq-pill"></span>
      <div class="server-dot" id="server-dot"></div>
      <span class="server-label" id="server-label">not connected</span>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('capture')">Capture</button>
    <button class="tab" onclick="switchTab('history')">History</button>
    <button class="tab" onclick="switchTab('settings')">Settings</button>
  </div>

  <!-- CAPTURE TAB -->
  <div class="panel active" id="panel-capture">
    <label>URL <span class="source-badge" id="source-badge">web</span></label>
    <input type="text" id="url" readonly />

    <label>Title</label>
    <input type="text" id="title" />

    <label>Note (optional)</label>
    <textarea id="note" placeholder="What did you learn or want to remember?"></textarea>

    <label>Link to Topics</label>
    <div class="suggestions-label" id="suggestions-label" style="display:none">
      ✨ Suggested matches based on this page:
    </div>
    <div class="topic-list" id="suggestions-list" style="display:none"></div>
    <div class="topic-search-row">
      <input type="text" id="search" placeholder="Search all topics…" />
      <span class="topic-count" id="topic-count"></span>
    </div>
    <div class="topic-list" id="topic-list">
      <em style="font-size:11px; color:#6c7086;">Connect Rocky server or load topics in Settings</em>
    </div>

    <button class="add-btn" id="add-btn" disabled>Add to Knowledge Graph</button>
    <div class="status" id="status"></div>
  </div>

  <!-- HISTORY TAB -->
  <div class="panel" id="panel-history">
    <div class="history-list" id="history-list">
      <div class="empty-state">No captures yet</div>
    </div>
  </div>

  <!-- SETTINGS TAB -->
  <div class="panel" id="panel-settings">
    <div class="settings-section">
      <h3>Rocky Server</h3>
      <label>Server URL</label>
      <input type="text" id="server-url-input" placeholder="http://127.0.0.1:8080" />
      <div style="margin-top: 6px; display: flex; gap: 6px;">
        <button class="sync-btn" id="save-url-btn">Save</button>
        <button class="sync-btn" id="sync-btn">Sync Topics Now</button>
      </div>
      <div class="sync-info" id="sync-info"></div>
    </div>
    <div class="settings-section">
      <h3>Stored Topics</h3>
      <div class="sync-info" id="topics-info"></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
