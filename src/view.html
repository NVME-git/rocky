<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rocky — Knowledge Graph</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
       background: #0A0E1A; color: #F1F5F9; height: 100vh; overflow: hidden;
       display: flex; flex-direction: column; }

/* ── top bar ── */
#topbar { background: #070B14; border-bottom: 1px solid #1E293B;
          padding: 10px 16px; display: flex; flex-direction: column; gap: 8px;
          flex-shrink: 0; }
#stats-row { display: flex; gap: 20px; align-items: center; }
.stat { font-size: 12px; color: #64748B; }
.stat span { color: #F1F5F9; font-weight: 600; margin-left: 4px; }
.stat-known span { color: #1D9E75; }
.stat-fading span { color: #EF9F27; }
.stat-gap span { color: #E24B4A; }

#controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
#search { background: #111827; border: 1px solid #1E293B; border-radius: 6px;
          color: #F1F5F9; padding: 4px 10px; font-size: 12px; width: 180px; outline: none; }
#search:focus { border-color: #F59E0B; }
#search::placeholder { color: #64748B; }
.domain-btn { background: #111827; border: 1px solid #1E293B; border-radius: 4px;
              color: #94A3B8; padding: 3px 8px; font-size: 11px; cursor: pointer;
              transition: all 0.15s; white-space: nowrap; }
.domain-btn:hover { border-color: #F59E0B; color: #F59E0B; }
.domain-btn.active { background: rgba(245,158,11,0.15); border-color: #F59E0B; color: #F59E0B; }
.domain-btn.all-btn { border-color: #334155; color: #CBD5E1; }
.domain-btn.all-btn.active { background: rgba(203,213,225,0.1); border-color: #CBD5E1; color: #CBD5E1; }
#spread-wrap { display: flex; align-items: center; gap: 6px; margin-left: 8px; }
#spread-wrap label { font-size: 11px; color: #64748B; white-space: nowrap; }
#spread-slider { accent-color: #F59E0B; width: 80px; cursor: pointer; }

/* ── timeline strip ── */
#timeline-strip { background: #070B14; border-bottom: 1px solid #1E293B;
                  padding: 8px 16px; display: flex; align-items: center;
                  gap: 12px; flex-shrink: 0; }

#scrubber-wrap { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 0; }
#tl-scrubber { flex: 1; accent-color: #F59E0B; cursor: pointer; min-width: 0; }
#tl-date-label { font-size: 12px; color: #F59E0B; font-weight: 600;
                 white-space: nowrap; min-width: 130px; text-align: right; }
#tl-count-label { font-size: 11px; color: #64748B; white-space: nowrap; }

/* ── main ── */
#main { display: flex; flex: 1; overflow: hidden; }
#graph-container { flex: 1; position: relative; overflow: hidden; }
svg#graph { width: 100%; height: 100%; }

/* ── taxonomy panel (left) ── */
#tax-panel { width: 220px; background: #070B14; border-right: 1px solid #1E293B;
             overflow-y: auto; flex-shrink: 0; display: none; }
#tax-panel.open { display: block; }
#tax-inner { padding: 16px; }
.tax-header { font-size: 11px; color: #64748B; text-transform: uppercase;
              letter-spacing: 0.5px; margin-bottom: 12px; }
.tax-count  { font-size: 18px; font-weight: 700; color: #F1F5F9; }
.tax-count-label { font-size: 11px; color: #64748B; margin-left: 4px; }
.tax-domain-section { margin-bottom: 14px; }
.tax-domain-name { font-size: 11px; color: #F59E0B; font-weight: 700;
                   text-transform: uppercase; letter-spacing: 0.4px;
                   margin-bottom: 6px; padding-bottom: 4px; border-bottom: 1px solid #1E293B; }
.tax-node-item { font-size: 12px; color: #CBD5E1; padding: 3px 0;
                 cursor: pointer; border-radius: 3px; }
.tax-node-item:hover { color: #F1F5F9; }

/* ── repo filter ── */
#repo-filters { display: flex; gap: 6px; flex-wrap: wrap; }
.repo-btn { background: #111827; border: 1px solid #1E293B; border-radius: 4px;
            color: #94A3B8; padding: 3px 8px; font-size: 11px; cursor: pointer;
            transition: all 0.15s; white-space: nowrap; }
.repo-btn:hover { border-color: #06B6D4; color: #06B6D4; }
.repo-btn.active { background: rgba(6,182,212,0.12); border-color: #06B6D4; color: #06B6D4; }
/* ── project summary bar ── */
#summary-bar { background: #070B14; border-bottom: 1px solid #1E293B;
               padding: 6px 16px; font-size: 11px; color: #475569;
               display: none; flex-shrink: 0; }
#summary-bar.visible { display: block; }
/* ── canonical Q&A in panel ── */
.panel-qa-section { margin-top: 14px; }
.panel-qa-q { font-size: 12px; color: #06B6D4; line-height: 1.5; margin-bottom: 6px; font-style: italic; }
.panel-qa-a { font-size: 11px; color: #64748B; line-height: 1.5;
              border-left: 2px solid #1E293B; padding-left: 8px; }
/* ── side panel ── */
#panel { width: 300px; background: #070B14; border-left: 1px solid #1E293B;
         overflow-y: auto; flex-shrink: 0; display: none; position: relative; }
#panel.open { display: block; }
#panel-inner { padding: 20px; }
#panel-close { position: absolute; top: 12px; right: 12px; background: none;
               border: none; color: #64748B; font-size: 18px; cursor: pointer; line-height: 1; }
#panel-close:hover { color: #F1F5F9; }
.panel-topic { font-size: 16px; font-weight: 700; color: #F1F5F9; margin-bottom: 4px; padding-right: 24px; }
.panel-domain { font-size: 11px; color: #F59E0B; text-transform: uppercase;
                letter-spacing: 0.5px; margin-bottom: 12px; }
.panel-desc { font-size: 13px; color: #94A3B8; line-height: 1.5; margin-bottom: 16px; }
.panel-row { display: flex; justify-content: space-between; font-size: 12px;
             padding: 5px 0; border-bottom: 1px solid #1E293B; }
.panel-label { color: #64748B; }
.panel-value { color: #F1F5F9; font-weight: 500; }
.panel-section { margin-top: 16px; }
.panel-section-title { font-size: 11px; color: #64748B; text-transform: uppercase;
                       letter-spacing: 0.5px; margin-bottom: 8px; }
.edge-item { font-size: 12px; padding: 6px 8px; background: #111827;
             border-radius: 4px; margin-bottom: 4px; cursor: pointer; }
.edge-item:hover { background: #1E293B; }
.edge-kind { display: inline-block; font-size: 10px; padding: 1px 5px;
             border-radius: 3px; margin-right: 6px; font-weight: 600; }
.edge-kind.implies        { background: rgba(6,182,212,0.15); color: #06B6D4; }
.edge-kind.depends_on     { background: rgba(245,158,11,0.15); color: #F59E0B; }
.edge-kind.conflicts_with { background: rgba(226,75,74,0.15); color: #E24B4A; }
.edge-kind.part_of        { background: rgba(29,158,117,0.15); color: #1D9E75; }
.edge-peer { color: #CBD5E1; }
.link.selected-edge { stroke-width: 3px !important; opacity: 1 !important; }
.edge-desc { font-size: 11px; color: #64748B; margin-top: 4px; line-height: 1.45; }
/* edge panel view */
.panel-edge-nodes { display: flex; align-items: center; gap: 8px;
                    font-size: 13px; margin-bottom: 16px; flex-wrap: wrap; }
.panel-edge-node  { color: #F1F5F9; font-weight: 600; }
.panel-edge-arrow { color: #64748B; font-size: 11px; }
.panel-edge-reason { font-size: 13px; color: #94A3B8; line-height: 1.6;
                     background: #0A0E1A; border-radius: 6px; padding: 12px;
                     border-left: 3px solid var(--edge-color, #06B6D4); }

/* ── review history ── */
.review-item { margin-bottom: 10px; padding: 10px; background: #0A0E1A;
               border-radius: 6px; border: 1px solid #1E293B; }
.review-date { font-size: 10px; color: #64748B; margin-bottom: 6px; }
.review-q  { font-size: 12px; color: #94A3B8; margin-bottom: 4px; line-height: 1.45; }
.review-a  { font-size: 12px; color: #CBD5E1; margin-bottom: 4px; line-height: 1.45;
             font-style: italic; border-left: 2px solid #334155; padding-left: 8px; }
.review-fb { font-size: 12px; color: #06B6D4; line-height: 1.45; margin-bottom: 6px; }
.review-score { display: inline-block; font-size: 10px; font-weight: 600;
                padding: 1px 6px; border-radius: 3px; }
.review-score.known { background: rgba(29,158,117,0.15); color: #1D9E75; }
.review-score.stale { background: rgba(239,159,39,0.15);  color: #EF9F27; }
.review-score.gap   { background: rgba(226,75,74,0.15);   color: #E24B4A; }

/* ── graph elements ── */
/* Removed CSS transitions on tick-driven elements to avoid costly repaint storms */
.link { stroke-opacity: 0.6; }
.link.dimmed { stroke-opacity: 0.05; }
.node circle { cursor: pointer; }
.node.selected circle { stroke: #F59E0B !important; stroke-width: 2.5px; }
.node.dimmed circle { opacity: 0.18; }
.node.dimmed text   { opacity: 0.12; }
.node.highlighted circle { stroke: #F59E0B; stroke-width: 2px; }
.node text { pointer-events: none; font-size: 13px; fill: #CBD5E1; text-anchor: middle; }

.legend { position: absolute; bottom: 16px; left: 16px; background: rgba(7,11,20,0.85);
          border: 1px solid #1E293B; border-radius: 6px; padding: 10px 14px; }
.legend-title { font-size: 10px; color: #64748B; margin-bottom: 6px; text-transform: uppercase; }
.legend-row { display: flex; align-items: center; gap: 8px; font-size: 11px;
              color: #94A3B8; margin-bottom: 4px; }
</style>
</head>
<body>

<div id="topbar">
  <div id="stats-row">
    <div class="stat">Nodes: <span id="s-total"></span></div>
    <div class="stat stat-known">Known: <span id="s-known"></span></div>
    <div class="stat stat-fading">Fading: <span id="s-fading"></span></div>
    <div class="stat stat-gap">Gap: <span id="s-gap"></span></div>
    <div class="stat">Edges: <span id="s-edges"></span></div>
  </div>
  <div id="controls">
    <input id="search" type="text" placeholder="Search topics…">
    <div id="domain-filters"></div>
    <div id="repo-filters"></div>
    <div id="spread-wrap">
      <label for="spread-slider">Spread</label>
      <input id="spread-slider" type="range" min="1" max="10" value="5">
    </div>
  </div>
</div>

<!-- project summary bar -->
<div id="summary-bar"></div>

<!-- always-visible scrubber strip -->
<div id="timeline-strip">
  <div id="scrubber-wrap">
    <input id="tl-scrubber" type="range" min="0" max="100" value="100">
    <span id="tl-date-label">all time</span>
  </div>
  <span id="tl-count-label"></span>
</div>

<div id="main">
  <div id="tax-panel">
    <div id="tax-inner"></div>
  </div>
  <div id="graph-container">
    <svg id="graph"></svg>
    <div class="legend">
      <div class="legend-title">Edge types</div>
      <div class="legend-row">
        <svg width="30" height="10"><line x1="0" y1="5" x2="30" y2="5" stroke="#06B6D4" stroke-width="1.5"/></svg>implies
      </div>
      <div class="legend-row">
        <svg width="30" height="10"><line x1="0" y1="5" x2="30" y2="5" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="6,3"/></svg>depends on
      </div>
      <div class="legend-row">
        <svg width="30" height="10"><line x1="0" y1="5" x2="30" y2="5" stroke="#1D9E75" stroke-width="1.5" stroke-dasharray="2,4"/></svg>part of
      </div>
      <div class="legend-row">
        <svg width="30" height="10"><line x1="0" y1="5" x2="30" y2="5" stroke="#E24B4A" stroke-width="1.5" stroke-dasharray="2,2"/></svg>conflicts
      </div>
    </div>
  </div>
  <div id="panel">
    <button id="panel-close">✕</button>
    <div id="panel-inner">
      <!-- node view -->
      <div id="panel-node-view">
        <div class="panel-topic" id="p-topic"></div>
        <div class="panel-domain" id="p-domain"></div>
        <div class="panel-desc" id="p-desc"></div>
        <div class="panel-row"><span class="panel-label">Retrievability</span><span class="panel-value" id="p-recall"></span></div>
        <div class="panel-row"><span class="panel-label">Stability</span><span class="panel-value" id="p-stab"></span></div>
        <div class="panel-row"><span class="panel-label">Last reviewed</span><span class="panel-value" id="p-reviewed"></span></div>
        <div class="panel-row"><span class="panel-label">Reviews</span><span class="panel-value" id="p-count"></span></div>
        <div class="panel-row"><span class="panel-label">Kind</span><span class="panel-value" id="p-kind"></span></div>
        <div class="panel-section" id="p-qa-section" style="display:none">
          <div class="panel-section-title">Quiz Question</div>
          <div class="panel-qa-q" id="p-qa-q"></div>
          <div class="panel-section-title" style="margin-top:8px">Ideal Answer</div>
          <div class="panel-qa-a" id="p-qa-a"></div>
        </div>
        <div class="panel-section">
          <div class="panel-section-title">Edges</div>
          <div id="p-edges"></div>
        </div>
        <div class="panel-section" id="p-reviews-section">
          <div class="panel-section-title">Review History</div>
          <div id="p-reviews"></div>
        </div>
      </div>
      <!-- edge view -->
      <div id="panel-edge-view" style="display:none">
        <div class="panel-edge-nodes" id="pe-nodes"></div>
        <div class="panel-edge-reason" id="pe-reason"></div>
        <div id="pe-strength" style="margin-top:12px;font-size:11px;color:#475569"></div>
      </div>
    </div>
  </div>
</div>

<script>
const PKG = __DATA_JSON__;

// ── colour helpers ──────────────────────────────────────────────────────────
function nodeColor(d) {
  if (d.kind === 'user')   return '#F59E0B';
  if (d.kind === 'domain') return '#1E293B';
  const r = d.retrievability;
  if (r >= 0.7) return d3.interpolateRgb('#EF9F27', '#1D9E75')((r - 0.7) / 0.3);
  return d3.interpolateRgb('#E24B4A', '#EF9F27')(r / 0.7);
}
function nodeRadius(d) {
  if (d.kind === 'user')   return 28;
  if (d.kind === 'domain') return 18;
  return Math.max(6, Math.min(22, 6 + d.stability * 1.2));
}
function nodeStroke(d) {
  if (d.kind === 'user')   return '#F59E0B';
  if (d.kind === 'domain') return '#475569';
  return '#0A0E1A';
}
function nodeStrokeWidth(d) {
  return (d.kind === 'user' || d.kind === 'domain') ? 2 : 1.5;
}

// ── stats ───────────────────────────────────────────────────────────────────
const nodes = PKG.nodes;
const edges = PKG.edges;

// Pre-cache radius on every node so tick/positionLine never recompute it.
nodes.forEach(n => { n._r = nodeRadius(n); });

// Fast O(1) node lookup — hoisted here so forceLink distance can use it.
const nodeById = Object.fromEntries(nodes.map(n => [n.id, n]));

const topicNodes = nodes.filter(n => n.kind !== 'domain' && n.kind !== 'user');
document.getElementById('s-total').textContent = topicNodes.length;
document.getElementById('s-known').textContent = topicNodes.filter(n => n.classification === 'known').length;
document.getElementById('s-fading').textContent = topicNodes.filter(n => n.classification === 'stale').length;
document.getElementById('s-gap').textContent = topicNodes.filter(n => n.classification === 'gap').length;
document.getElementById('s-edges').textContent = edges.filter(e => {
  const s = nodeById[typeof e.source === 'object' ? e.source.id : e.source];
  const t = nodeById[typeof e.target === 'object' ? e.target.id : e.target];
  return s && t && s.kind !== 'domain' && s.kind !== 'user' && t.kind !== 'domain' && t.kind !== 'user';
}).length;

// ── domain filter ───────────────────────────────────────────────────────────
const domains = [...new Set(topicNodes.map(n => n.domain || 'Other'))].sort();
let activeDomains = new Set(domains);
let scrubberCutoff = null; // null = show all

const filterEl = document.getElementById('domain-filters');
const allBtn = document.createElement('button');
allBtn.className = 'domain-btn all-btn active';
allBtn.textContent = 'All';
allBtn.onclick = () => {
  const allActive = activeDomains.size === domains.length;
  if (allActive) {
    // Deselect all — user can then click individual domains
    activeDomains = new Set();
    document.querySelectorAll('.domain-btn:not(.all-btn)').forEach(b => b.classList.remove('active'));
    allBtn.classList.remove('active');
  } else {
    activeDomains = new Set(domains);
    document.querySelectorAll('.domain-btn:not(.all-btn)').forEach(b => b.classList.add('active'));
    allBtn.classList.add('active');
  }
  applyFilters();
};
filterEl.appendChild(allBtn);
domains.forEach(d => {
  const btn = document.createElement('button');
  btn.className = 'domain-btn active';
  btn.textContent = d;
  btn.onclick = () => {
    const wasAllActive = activeDomains.size === domains.length;
    if (wasAllActive) {
      // Exclusive select: deselect all, activate only this one
      activeDomains = new Set([d]);
      document.querySelectorAll('.domain-btn:not(.all-btn)').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      allBtn.classList.remove('active');
    } else {
      if (activeDomains.has(d)) { activeDomains.delete(d); btn.classList.remove('active'); }
      else { activeDomains.add(d); btn.classList.add('active'); }
      allBtn.classList.toggle('active', activeDomains.size === domains.length);
    }
    applyFilters();
  };
  filterEl.appendChild(btn);
});

// ── repo filter ─────────────────────────────────────────────────────────────
const summaries = PKG.summaries || {};
const repos = [...new Set(topicNodes.map(n => n.repo).filter(Boolean))].sort();
let activeRepos = new Set(repos);

if (repos.length > 1) {
  const repoEl = document.getElementById('repo-filters');
  const allRepoBtn = document.createElement('button');
  allRepoBtn.className = 'repo-btn active';
  allRepoBtn.textContent = 'All projects';
  allRepoBtn.onclick = () => {
    activeRepos = new Set(repos);
    document.querySelectorAll('.repo-btn:not([data-repo="all"])').forEach(b => b.classList.add('active'));
    allRepoBtn.classList.add('active');
    updateSummaryBar(null);
    applyFilters();
  };
  allRepoBtn.dataset.repo = 'all';
  repoEl.appendChild(allRepoBtn);
  repos.forEach(r => {
    const btn = document.createElement('button');
    btn.className = 'repo-btn active';
    btn.textContent = r;
    btn.onclick = () => {
      if (activeRepos.size === repos.length) {
        activeRepos = new Set([r]);
        document.querySelectorAll('.repo-btn:not([data-repo="all"])').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        allRepoBtn.classList.remove('active');
      } else {
        if (activeRepos.has(r)) { activeRepos.delete(r); btn.classList.remove('active'); }
        else { activeRepos.add(r); btn.classList.add('active'); }
        allRepoBtn.classList.toggle('active', activeRepos.size === repos.length);
      }
      updateSummaryBar(activeRepos.size === 1 ? [...activeRepos][0] : null);
      applyFilters();
    };
    repoEl.appendChild(btn);
  });
}

function updateSummaryBar(repo) {
  const bar = document.getElementById('summary-bar');
  if (repo && summaries[repo]) {
    bar.textContent = summaries[repo];
    bar.classList.add('visible');
  } else {
    bar.classList.remove('visible');
  }
}

// ── search ──────────────────────────────────────────────────────────────────
let searchTerm = '';
let _searchTimer = null;
document.getElementById('search').addEventListener('input', e => {
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(() => {
    searchTerm = e.target.value.toLowerCase().trim();
    applyFilters();
  }, 120);
});

function applyFilters() {
  const isFiltered = activeDomains.size < domains.length || !!searchTerm || !!scrubberCutoff;
  const visibleTopics = topicNodes.filter(n =>
    (!scrubberCutoff || n.created_at <= scrubberCutoff) &&
    (activeDomains.size > 0 && activeDomains.has(n.domain || 'Other')) &&
    (activeRepos.size === 0 || !n.repo || activeRepos.has(n.repo)) &&
    (!searchTerm || n.topic.toLowerCase().includes(searchTerm))
  );
  const visible = new Set([
    ...nodes.filter(n => n.kind === 'domain' || n.kind === 'user').map(n => n.id),
    ...visibleTopics.map(n => n.id),
  ]);

  // Mark each node with its current visibility so the tick handler can skip
  // position updates for nodes hidden from view.
  nodes.forEach(n => { n._visible = visible.has(n.id); });

  nodeGroup.selectAll('.node').each(function(d) {
    const show = visible.has(d.id);
    const isStructural = d.kind === 'domain' || d.kind === 'user';
    const el = d3.select(this);
    el.classed('dimmed', !show)
      .classed('highlighted', show && !!searchTerm && !isStructural)
      // Use display:none for filtered-out topic nodes so the browser skips
      // paint entirely instead of rendering them at near-zero opacity.
      .attr('display', (!show && !isStructural) ? 'none' : null);
  });

  linkGroup.selectAll('.link, .link-hit').each(function(d) {
    const s = typeof d.source === 'object' ? d.source.id : d.source;
    const t = typeof d.target === 'object' ? d.target.id : d.target;
    const dimmed = !visible.has(s) || !visible.has(t);
    // Propagate visibility onto the datum so renderTick can skip hidden edges.
    d._visible = !dimmed;
    const el = d3.select(this);
    if (el.classed('link')) {
      el.classed('dimmed', dimmed)
        .attr('marker-end', dimmed ? null : `url(#arrow-${d.kind})`);
    }
    el.attr('display', dimmed ? 'none' : null);
  });

  // ── taxonomy panel ──────────────────────────────────────────────────────
  const taxPanel = document.getElementById('tax-panel');
  const domainFilter = activeDomains.size < domains.length;
  if (!domainFilter && !searchTerm) {
    taxPanel.classList.remove('open');
    return;
  }
  taxPanel.classList.add('open');

  // Group visible topics by domain
  const byDomain = {};
  visibleTopics.forEach(n => {
    const d = n.domain || 'Other';
    if (!byDomain[d]) byDomain[d] = [];
    byDomain[d].push(n);
  });

  const total = visibleTopics.length;
  let html = `<div class="tax-header">
    <span class="tax-count">${total}</span>
    <span class="tax-count-label">topic${total !== 1 ? 's' : ''}</span>
  </div>`;

  Object.entries(byDomain).sort(([a],[b]) => a.localeCompare(b)).forEach(([domain, ns]) => {
    html += `<div class="tax-domain-section">
      <div class="tax-domain-name">${domain} (${ns.length})</div>
      ${ns.sort((a,b) => a.topic.localeCompare(b.topic)).map(n =>
        `<div class="tax-node-item" data-id="${n.id}">${n.topic}</div>`
      ).join('')}
    </div>`;
  });

  document.getElementById('tax-inner').innerHTML = html;

  // Click a node in the list → select it in the graph
  document.querySelectorAll('.tax-node-item').forEach(el => {
    el.addEventListener('click', () => {
      const n = nodes.find(nd => nd.id === el.dataset.id);
      if (n) selectNode(n);
    });
  });
}

// ── D3 force graph ──────────────────────────────────────────────────────────
const svg = d3.select('#graph');
const container = document.getElementById('graph-container');
const W = () => container.clientWidth;
const H = () => container.clientHeight;

const g = svg.append('g').attr('class', 'graph-root');
svg.call(d3.zoom().scaleExtent([0.2, 4]).on('zoom', e => g.attr('transform', e.transform)));

const defs = svg.append('defs');
const arrowColors = { implies: '#06B6D4', depends_on: '#F59E0B', conflicts_with: '#E24B4A', part_of: '#1D9E75' };
['implies','depends_on','conflicts_with','part_of'].forEach(k => {
  defs.append('marker').attr('id', 'arrow-' + k)
    .attr('viewBox', '0 -5 10 10').attr('refX', 0).attr('refY', 0)
    .attr('markerWidth', 6).attr('markerHeight', 6).attr('orient', 'auto')
    .append('path').attr('d', 'M0,-5L10,0L0,5').attr('fill', arrowColors[k]);
});

const linkGroup = g.append('g');
const nodeGroup = g.append('g');

const edgeStyle = {
  implies:        { dash: null,  color: '#06B6D4' },
  depends_on:     { dash: '6,3', color: '#F59E0B' },
  part_of:        { dash: '2,4', color: '#1D9E75' },
  conflicts_with: { dash: '2,2', color: '#E24B4A' },
};

const link = linkGroup.selectAll('.link')
  .data(edges).enter().append('line').attr('class', 'link')
  .attr('stroke', d => (edgeStyle[d.kind] || edgeStyle.implies).color)
  .attr('stroke-width', d => Math.max(1, d.strength * 2.5))
  .attr('stroke-dasharray', d => (edgeStyle[d.kind] || edgeStyle.implies).dash)
  .attr('marker-end', d => `url(#arrow-${d.kind})`);

// Transparent hit-area lines — wide enough to click easily
const linkHit = linkGroup.selectAll('.link-hit')
  .data(edges).enter().append('line').attr('class', 'link-hit')
  .attr('stroke', 'transparent').attr('stroke-width', 12).style('cursor', 'pointer')
  .on('click', (e, d) => { e.stopPropagation(); selectEdge(d); });

// spread: 1–10 → multiplier 0.5–3.0
let spreadMult = 1.0;
function chargeFor(d) {
  const base = d.kind === 'user' ? -500 : d.kind === 'domain' ? -300 : -200;
  return base * spreadMult;
}

const simulation = d3.forceSimulation(nodes)
  // Settle ~2× faster than D3's default alphaDecay (0.0228) so large graphs
  // stop ticking sooner after load and after user interactions.
  .alphaDecay(0.04)
  .force('link', d3.forceLink(edges).id(d => d.id).distance(d => {
    // Use pre-built lookup object for O(1) access instead of O(n) Array.find.
    const s = typeof d.source === 'object' ? d.source : nodeById[d.source];
    const t = typeof d.target === 'object' ? d.target : nodeById[d.target];
    if (t && t.kind === 'user') return 140;
    if (s && s.kind === 'domain') return 100;
    return 90 + (1 - d.strength) * 50;
  }))
  .force('charge', d3.forceManyBody().strength(chargeFor))
  .force('center', d3.forceCenter(W() / 2, H() / 2))
  // Use cached _r instead of recomputing nodeRadius each time.
  .force('collision', d3.forceCollide().radius(d => d._r + 22));

document.getElementById('spread-slider').addEventListener('input', function() {
  spreadMult = 0.5 + (this.value - 1) * (2.5 / 9);
  simulation.force('charge', d3.forceManyBody().strength(chargeFor));
  simulation.alpha(0.4).restart();
});

const node = nodeGroup.selectAll('.node')
  .data(nodes).enter().append('g').attr('class', 'node')
  .call(d3.drag()
    .on('start', (e, d) => { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
    .on('drag',  (e, d) => { d.fx = e.x; d.fy = e.y; })
    .on('end',   (e, d) => { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }))
  .on('click', (e, d) => { e.stopPropagation(); selectNode(d); });

node.append('circle')
  .attr('r', d => d._r)
  .attr('fill', d => nodeColor(d))
  .attr('stroke', d => nodeStroke(d))
  .attr('stroke-width', d => nodeStrokeWidth(d));

node.append('text')
  .style('font-size', d => d.kind === 'user' ? '13px' : d.kind === 'domain' ? '11px' : '13px')
  .style('font-weight', d => (d.kind === 'user' || d.kind === 'domain') ? '700' : 'normal')
  .style('fill', d => d.kind === 'user' ? '#0A0E1A' : d.kind === 'domain' ? '#F1F5F9' : '#CBD5E1')
  .each(function(d) {
    const el = d3.select(this);
    if (d.kind === 'user') {
      // Word-wrap to fit inside circle (r=28 → ~8 chars per line at 11px bold)
      const maxChars = 9, lineH = 15;
      const words = d.topic.split(/\s+/);
      const lines = [];
      let cur = '';
      for (const w of words) {
        const word = w.length > maxChars ? w.slice(0, maxChars - 1) + '…' : w;
        const test = cur ? cur + ' ' + word : word;
        if (test.length <= maxChars) { cur = test; }
        else { if (cur) lines.push(cur); cur = word; }
      }
      if (cur) lines.push(cur);
      // Centre the block vertically
      const startDy = -(lines.length - 1) * lineH / 2;
      lines.forEach((line, i) =>
        el.append('tspan').attr('x', 0).attr('dy', i === 0 ? startDy : lineH).text(line));
    } else if (d.kind === 'domain') {
      const t = d.topic;
      el.attr('dy', '0').style('dominant-baseline', 'central')
        .text(t.length > 9 ? t.slice(0, 8) + '…' : t);
    } else {
      el.attr('dy', d._r + 14)
        .text(d.topic.length > 22 ? d.topic.slice(0, 20) + '…' : d.topic);
    }
  });

// rAF-throttled tick handler: coalesce multiple physics steps into a single
// DOM write per animation frame, and skip nodes/edges hidden by filters.
let _rafPending = false;
simulation.on('tick', () => {
  if (_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(() => {
    _rafPending = false;
    renderTick();
  });
});

function renderTick() {
  link.each(function(d) {
    if (d._visible === false) return; // skip hidden edges
    const dx = d.target.x - d.source.x, dy = d.target.y - d.source.y;
    const dist = Math.sqrt(dx * dx + dy * dy) || 1;
    const srcR = d.source._r + 4;
    const tgtR = d.target._r + 10;
    const el = this;
    el.setAttribute('x1', d.source.x + dx / dist * srcR);
    el.setAttribute('y1', d.source.y + dy / dist * srcR);
    el.setAttribute('x2', d.target.x - dx / dist * tgtR);
    el.setAttribute('y2', d.target.y - dy / dist * tgtR);
  });
  linkHit.each(function(d) {
    if (d._visible === false) return;
    const dx = d.target.x - d.source.x, dy = d.target.y - d.source.y;
    const dist = Math.sqrt(dx * dx + dy * dy) || 1;
    const srcR = d.source._r + 4;
    const tgtR = d.target._r + 10;
    const el = this;
    el.setAttribute('x1', d.source.x + dx / dist * srcR);
    el.setAttribute('y1', d.source.y + dy / dist * srcR);
    el.setAttribute('x2', d.target.x - dx / dist * tgtR);
    el.setAttribute('y2', d.target.y - dy / dist * tgtR);
  });
  // Only update transform for nodes currently visible to skip paint work.
  node.each(function(d) {
    if (d._visible === false) return;
    this.setAttribute('transform', `translate(${d.x},${d.y})`);
  });
}

svg.on('click', () => closePanel());
window.addEventListener('resize', () => {
  simulation.force('center', d3.forceCenter(W() / 2, H() / 2)).alpha(0.1).restart();
});

// ── side panel ──────────────────────────────────────────────────────────────
const edgeIndex = {};
nodes.forEach(n => { edgeIndex[n.id] = []; });
edges.forEach(e => {
  const s = typeof e.source === 'object' ? e.source.id : e.source;
  const t = typeof e.target === 'object' ? e.target.id : e.target;
  if (edgeIndex[s]) edgeIndex[s].push({ ...e, peer: t });
  if (edgeIndex[t]) edgeIndex[t].push({ ...e, peer: s });
});
// nodeById is declared near the top of the script block.

function selectNode(d) {
  link.classed('selected-edge', false);
  showNodeView();
  node.classed('selected', n => n.id === d.id);
  document.getElementById('p-topic').textContent = d.topic;
  document.getElementById('p-domain').textContent = d.domain || 'Other';
  document.getElementById('p-desc').textContent = d.description;
  document.getElementById('p-recall').textContent = (d.retrievability * 100).toFixed(0) + '%';
  document.getElementById('p-stab').textContent = d.stability.toFixed(1) + 'd';
  document.getElementById('p-reviewed').textContent = d.last_reviewed;
  document.getElementById('p-count').textContent = d.review_count;
  document.getElementById('p-kind').textContent = d.kind
    + (d.repo ? ` · ${d.repo}` : '');
  // Canonical question + ideal answer
  const qaSection = document.getElementById('p-qa-section');
  if (d.canonical_question) {
    document.getElementById('p-qa-q').textContent = d.canonical_question;
    document.getElementById('p-qa-a').textContent = d.canonical_answer || '—';
    qaSection.style.display = '';
  } else {
    qaSection.style.display = 'none';
  }
  const nodeEdges = edgeIndex[d.id] || [];
  document.getElementById('p-edges').innerHTML = nodeEdges.length === 0
    ? '<div style="color:#64748B;font-size:12px">No edges yet</div>'
    : nodeEdges.map(e => {
        const label = nodeById[e.peer] ? nodeById[e.peer].topic : e.peer;
        const desc = e.description ? `<div class="edge-desc">${e.description}</div>` : '';
        return `<div class="edge-item" data-edge-id="${e.id}"><span class="edge-kind ${e.kind}">${e.kind.replace(/_/g,' ')}</span><span class="edge-peer">${label}</span>${desc}</div>`;
      }).join('');
  // Review history — hidden for structural (domain/user) nodes
  const reviewSection = document.getElementById('p-reviews-section');
  const reviews = d.reviews || [];
  if (d.kind === 'domain' || d.kind === 'user') {
    reviewSection.style.display = 'none';
  } else {
    reviewSection.style.display = '';
    document.getElementById('p-reviews').innerHTML = reviews.length === 0
      ? '<div style="color:#64748B;font-size:12px">No reviews yet</div>'
      : reviews.map(r => {
          const pct = Math.round(r.score * 100);
          const cls = pct >= 70 ? 'known' : pct >= 40 ? 'stale' : 'gap';
          return `<div class="review-item">
            <div class="review-date">${r.date}</div>
            ${r.question ? `<div class="review-q">Q: ${r.question}</div>` : ''}
            ${r.answer   ? `<div class="review-a">${r.answer}</div>` : ''}
            ${r.feedback ? `<div class="review-fb">${r.feedback}</div>` : ''}
            <span class="review-score ${cls}">${pct}%</span>
          </div>`;
        }).join('');
  }
  document.getElementById('panel').classList.add('open');
}
const edgeColors = { implies: '#06B6D4', depends_on: '#F59E0B', conflicts_with: '#E24B4A', part_of: '#1D9E75' };

function showNodeView()  {
  document.getElementById('panel-node-view').style.display = '';
  document.getElementById('panel-edge-view').style.display = 'none';
}
function showEdgeView() {
  document.getElementById('panel-node-view').style.display = 'none';
  document.getElementById('panel-edge-view').style.display = '';
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  node.classed('selected', false);
  link.classed('selected-edge', false);
  showNodeView();
}
document.getElementById('panel-close').onclick = closePanel;

function selectEdge(d) {
  node.classed('selected', false);
  link.classed('selected-edge', e => e.id === d.id);
  const src = typeof d.source === 'object' ? d.source : nodeById[d.source];
  const tgt = typeof d.target === 'object' ? d.target : nodeById[d.target];
  const srcLabel = src ? src.topic : d.source;
  const tgtLabel = tgt ? tgt.topic : d.target;
  const color = edgeColors[d.kind] || '#06B6D4';
  const kindLabel = d.kind.replace(/_/g, ' ');
  document.getElementById('pe-nodes').innerHTML =
    `<span class="panel-edge-node">${srcLabel}</span>` +
    `<span class="panel-edge-arrow">→</span>` +
    `<span class="edge-kind ${d.kind}">${kindLabel}</span>` +
    `<span class="panel-edge-arrow">→</span>` +
    `<span class="panel-edge-node">${tgtLabel}</span>`;
  document.getElementById('pe-reason').style.setProperty('--edge-color', color);
  document.getElementById('pe-reason').innerHTML =
    d.description || '<em style="color:#475569">No reason recorded.</em>';
  document.getElementById('pe-strength').textContent = `Strength: ${(d.strength * 100).toFixed(0)}%`;
  showEdgeView();
  document.getElementById('panel').classList.add('open');
}

// ── timeline / scrubber ─────────────────────────────────────────────────────
// Scrubber positions: one per node sorted by created_at, plus sentinel for "all"
const sortedDates = [...new Set(nodes.map(n => n.created_at))].sort();
sortedDates.push('9999-99-99');
const scrubber = document.getElementById('tl-scrubber');
scrubber.max = sortedDates.length - 1;
scrubber.value = sortedDates.length - 1;

scrubber.addEventListener('input', onScrub);

function onScrub() {
  const idx = parseInt(scrubber.value);
  const isAll = idx === sortedDates.length - 1;
  const cutoff = isAll ? null : sortedDates[idx];
  scrubberCutoff = cutoff;
  applyFilters();

  const count = isAll ? nodes.length : nodes.filter(n => n.created_at <= cutoff).length;
  document.getElementById('tl-date-label').textContent = isAll ? 'all time' : cutoff;
  document.getElementById('tl-count-label').textContent = `${count} / ${nodes.length} topics`;
}
onScrub(); // initialise labels
</script>
</body>
</html>
